[package]
name = "steve-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "steve"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["event-stream", "events"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
futures = "0.3.34"
indicatif = "0.18.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
steve = { path = ".." }
tokio = { version = "1.47.1", features = ["macros"] }
